<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Neon developer profile banner</title><desc id="desc">Dark futuristic banner with animated cyan and violet neon lines.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="1" stop-color="#0b1730"/></linearGradient><linearGradient id="neon"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<g stroke="#16324d" stroke-width="1" opacity=".55"><path d="M0 45H1200M0 90H1200M0 135H1200M0 180H1200M0 225H1200M0 270H1200"/><path d="M50 0V300M100 0V300M150 0V300M200 0V300M250 0V300M300 0V300M350 0V300M400 0V300M450 0V300M500 0V300M550 0V300M600 0V300M650 0V300M700 0V300M750 0V300M800 0V300M850 0V300M900 0V300M950 0V300M1000 0V300M1050 0V300M1100 0V300M1150 0V300"/></g>
<rect x="34" y="30" width="1132" height="240" rx="12" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".8"/>
<circle cx="62" cy="54" r="5" fill="#fb7185"/><circle cx="80" cy="54" r="5" fill="#fbbf24"/><circle cx="98" cy="54" r="5" fill="#34d399"/>
<text x="600" y="105" text-anchor="middle" font-family="monospace" font-size="17" fill="#67e8f9" letter-spacing="5">GITHUB PROFILE // 2026</text>
<text x="600" y="160" text-anchor="middle" font-family="monospace" font-weight="700" font-size="43" fill="#f8fafc">GOWRI PRIYA</text>
<text x="600" y="194" text-anchor="middle" font-family="monospace" font-size="17" fill="#c4b5fd">PYTHON • DATA • SQL</text>
<text x="600" y="235" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">[ LEARN · BUILD · REPEAT ]</text>
<path d="M0 248 L190 248 L225 212 L480 212 L515 248 L760 248 L800 200 L1200 200" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".9" filter="url(#glow)" stroke-dasharray="500 1100"><animate attributeName="stroke-dashoffset" values="0;-1600" dur="7s" repeatCount="indefinite"/></path>
<circle cx="1090" cy="68" r="3" fill="#22d3ee"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="1120" cy="90" r="3" fill="#a78bfa"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
</svg>